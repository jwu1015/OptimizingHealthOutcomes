[project]
name = "precision"
version = "0.1.0"
description = "Precision Clinic: protocol engine and data pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
precision = "precision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
